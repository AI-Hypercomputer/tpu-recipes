                labels:
                  app.kubernetes.io/instance: "{{ .Release.Name }}"
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: "{{ .Release.Name }}-hyperdisk-balanced-tpu"
                resources:
                  requests:
                    storage: {{ .Values.server.data_disk_size }}
        {{- else }}
        - emptyDir:
            medium: Memory
          name: data-volume
        {{- end }}
        {{- end }}
        {{- if .Values.gcsfuse.enabled }}
