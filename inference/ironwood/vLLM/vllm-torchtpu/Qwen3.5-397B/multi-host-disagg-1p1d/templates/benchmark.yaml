          {{- if .Values.gke_reservation }}
          cloud.google.com/reservation-name: {{ .Values.gke_reservation | quote }}
          {{- end }}
          {{- if .Values.placement_policy }}
          cloud.google.com/placement-policy-name: {{ .Values.placement_policy | quote }}
          {{- end }}
        {{- end }}
        tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
        containers:
        - name: vllm-server
          image: {{.Values.server.image}}
          imagePullPolicy: IfNotPresent
          env:
          {{- if eq (int .Values.run_mode) 1 }}
          - name: HF_HUB_OFFLINE
            value: "1"
          {{- else }}
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: "{{ .Release.Name }}-hf-secret"
                key: hf_api_token
          {{- end }}
          {{- if ne .Values.server.engine_label "TORCH_TPU" }}
          - name: TPU_MULTIHOST_BACKEND
            value: ray
          - name: JAX_PLATFORMS
            value: ""
          {{- end }}
          {{if .Values.server.profile}}
          - name: PHASED_PROFILING_DIR
            value: {{ .Values.server.phased_profiling_dir | default "/tmp/results/profile" | quote }}
          {{end}}
          {{if .Values.server.model_impl_type}}
          - name: MODEL_IMPL_TYPE
            value: {{.Values.server.model_impl_type}}
          {{end}}
          command: ["/bin/bash", "-c"]
          args:
          - {{ printf "if [ \"${LWS_WORKER_INDEX:-0}\" = \"0\" ]; then\n%s\nelse\n%s\nfi" .Values.server.bash_command .Values.server.worker_bash_command | quote }}
          resources:
            limits:
              google.com/tpu: "{{.Values.server.num_chips_per_node}}"
            requests:
              google.com/tpu: "{{.Values.server.num_chips_per_node}}"
          ports:
          - containerPort: 8000
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - {{ "if [ \"${LWS_WORKER_INDEX:-0}\" = \"0\" ]; then (echo > /dev/tcp/localhost/8000) >/dev/null 2>&1; else exit 0; fi" | quote }}
            {{- if .Values.server.readiness_probe }}
            initialDelaySeconds: {{ .Values.server.readiness_probe.initial_delay_seconds | default 15 }}
            periodSeconds: {{ .Values.server.readiness_probe.period_seconds | default 10 }}
            failureThreshold: {{ .Values.server.readiness_probe.failure_threshold | default 3 }}
            {{- else }}
            initialDelaySeconds: {{ .Values.server.ready_check_timeout_sec | default 15 }}
            periodSeconds: 10
            {{- end }}
          volumeMounts:
          {{- range .Values.custom_volume_mounts }}
          - name: {{ .name }}
            mountPath: {{ .mountPath }}
            {{- if .readOnly }}
            readOnly: {{ .readOnly }}
            {{- end }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}
          {{- range .Values.server.pvc_mounts }}
          - mountPath: {{ .mount_path | quote }}
            name: {{ .volume_name | quote }}
            subPath: {{ tpl .sub_path $ | quote }}
            readOnly: {{ .read_only }}
          {{- end }}
          {{- if ne (int .Values.run_mode) 1 }}
          - mountPath: "/data"
            name: data-volume
          {{- end }}
          - mountPath: /dev/shm
            name: dshm
          {{- if .Values.gcsfuse.enabled }}
          {{- range .Values.gcsfuse.volumes }}
          - name: {{ .name }}
            mountPath: {{ .mountPath | quote }}
            readOnly: {{ .readOnly }}
          {{- end }}
          {{- end }}
        volumes:
        {{- range .Values.custom_volume_mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-{{ .pvcName }}
        {{- end }}
        {{- range .Values.server.pvc_mounts }}
        - name: {{ .volume_name | quote }}
          persistentVolumeClaim:
            claimName: {{ .pvc_name | quote }}
        {{- end }}
        - emptyDir:
            medium: Memory
          name: dshm
        {{- if ne (int .Values.run_mode) 1 }}
        {{- if .Values.server.data_disk_size }}
        - name: data-volume
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  app.kubernetes.io/instance: "{{ .Release.Name }}"
              spec:
                accessModes: [ "ReadWriteOnce" ]
                storageClassName: "{{ .Release.Name }}-hyperdisk-balanced-tpu"
                resources:
                  requests:
                    storage: {{ .Values.server.data_disk_size }}
        {{- else }}
        - emptyDir:
            medium: Memory
          name: data-volume
        {{- end }}
        {{- end }}
        {{- if .Values.gcsfuse.enabled }}
        {{- range .Values.gcsfuse.volumes }}
        - name: {{ .name }}
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: {{ .readOnly }}
            volumeAttributes:
              bucketName: {{ .bucketName }}
              mountOptions: {{ .mountOptions | quote }}
              {{- if .volumeAttributes }}
              {{- range $k, $v := .volumeAttributes }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- end }}
    {{- end }}
    workerTemplate:
      metadata:
        {{- if .Values.gcsfuse.enabled }}
        annotations:
          gke-gcsfuse/volumes: "true"
        {{- end }}
        labels:
          role: worker
          app: "{{ .Release.Name }}-tpu-pod"
          app.kubernetes.io/instance: "{{ .Release.Name }}"
          app.kubernetes.io/component: server
      spec:
        {{- if eq (int .Values.run_mode) 1 }}
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        {{- end }}
        {{- if .Values.kueue_priority_class }}
        priorityClassName: {{ .Values.kueue_priority_class | quote }}
        {{- end }}
        {{- if .Values.gcp_service_account }}
        serviceAccountName: {{ .Values.k8s_service_account | quote }}
        {{- end }}
        nodeSelector:
        {{- if eq (int .Values.run_mode) 1 }}
          tpu.google.com/slice-name: {{ .Values.tpu_slice_name }}
          tpu.google.com/type: tpu7x
        {{- else }}
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: {{.Values.server.topology}}
          {{- if .Values.gke_reservation }}
          cloud.google.com/reservation-name: {{ .Values.gke_reservation | quote }}
          {{- end }}
          {{- if .Values.placement_policy }}
          cloud.google.com/placement-policy-name: {{ .Values.placement_policy | quote }}
          {{- end }}
        {{- end }}
        tolerations:
        - key: "google.com/tpu"
          operator: "Exists"
        containers:
        - name: vllm-server
          image: {{.Values.server.image}}
          imagePullPolicy: IfNotPresent
          env:
          {{- if eq (int .Values.run_mode) 1 }}
          - name: HF_HUB_OFFLINE
            value: "1"
          {{- else }}
          - name: HUGGING_FACE_HUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: "{{ .Release.Name }}-hf-secret"
                key: hf_api_token
          {{- end }}
          {{- if ne .Values.server.engine_label "TORCH_TPU" }}
          - name: TPU_MULTIHOST_BACKEND
            value: ray
          - name: JAX_PLATFORMS
            value: ""
          {{- end }}
          {{if .Values.server.profile}}
          - name: PHASED_PROFILING_DIR
            value: {{ .Values.server.phased_profiling_dir | default "/tmp/results/profile" | quote }}
          {{end}}
          {{if .Values.server.model_impl_type}}
          - name: MODEL_IMPL_TYPE
            value: {{.Values.server.model_impl_type}}
          {{end}}
          command: ["/bin/bash", "-c"]
          args:
          - {{ printf "if [ \"${LWS_WORKER_INDEX:-0}\" = \"0\" ]; then\n%s\nelse\n%s\nfi" .Values.server.bash_command .Values.server.worker_bash_command | quote }}
          resources:
            limits:
              google.com/tpu: "{{.Values.server.num_chips_per_node}}"
            requests:
              google.com/tpu: "{{.Values.server.num_chips_per_node}}"
          ports:
          - containerPort: 8000
          readinessProbe:
            exec:
              command:
              - /bin/bash
              - -c
              - {{ "if [ \"${LWS_WORKER_INDEX:-0}\" = \"0\" ]; then (echo > /dev/tcp/localhost/8000) >/dev/null 2>&1; else exit 0; fi" | quote }}
            {{- if .Values.server.readiness_probe }}
            initialDelaySeconds: {{ .Values.server.readiness_probe.initial_delay_seconds | default 15 }}
            periodSeconds: {{ .Values.server.readiness_probe.period_seconds | default 10 }}
            failureThreshold: {{ .Values.server.readiness_probe.failure_threshold | default 3 }}
            {{- else }}
            initialDelaySeconds: {{ .Values.server.ready_check_timeout_sec | default 15 }}
            periodSeconds: 10
            {{- end }}
          volumeMounts:
          {{- range .Values.custom_volume_mounts }}
          - name: {{ .name }}
            mountPath: {{ .mountPath }}
            {{- if .readOnly }}
            readOnly: {{ .readOnly }}
            {{- end }}
            {{- if .subPath }}
            subPath: {{ .subPath }}
            {{- end }}
          {{- end }}
          {{- range .Values.server.pvc_mounts }}
          - mountPath: {{ .mount_path | quote }}
            name: {{ .volume_name | quote }}
            subPath: {{ tpl .sub_path $ | quote }}
            readOnly: {{ .read_only }}
          {{- end }}
          {{- if ne (int .Values.run_mode) 1 }}
          - mountPath: "/data"
            name: data-volume
          {{- end }}
          - mountPath: /dev/shm
            name: dshm
          {{- if .Values.gcsfuse.enabled }}
          {{- range .Values.gcsfuse.volumes }}
          - name: {{ .name }}
            mountPath: {{ .mountPath | quote }}
            readOnly: {{ .readOnly }}
          {{- end }}
          {{- end }}
        volumes:
        {{- range .Values.custom_volume_mounts }}
        - name: {{ .name }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-{{ .pvcName }}
        {{- end }}
        {{- range .Values.server.pvc_mounts }}
        - name: {{ .volume_name | quote }}
          persistentVolumeClaim:
