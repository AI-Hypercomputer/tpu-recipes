# yamllint disable
{{- if not .Values.client.external_server_host }}
{{- if ne (int .Values.run_mode) 1 }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: "{{ .Release.Name }}-hyperdisk-balanced-tpu"
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
  # provisioned-iops: "3000" # Optional: Adjust IOPS as needed
  # provisioned-throughput: "140" # Optional: Adjust Throughput (MiB/s) as needed
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
{{- if and (not .Values.is_multi_host) (ne (default "colocated" .Values.serving_mode) "disaggregated") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ .Release.Name }}-hd-claim"
spec:
  storageClassName: "{{ .Release.Name }}-hyperdisk-balanced-tpu"
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{.Values.server.data_disk_size}}
---
{{- end }}
{{- end }}
{{- end }}
{{- if ne (int .Values.run_mode) 1 }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ .Release.Name }}-hf-secret"
type: Opaque
stringData:
  hf_api_token: {{.Values.hf_token}}
---
{{- end }}
# Service account for GCS Workload Identity. Skip in client-only
# runs to prevent duplicate SA collisions during shared-server sweeps.
{{- if and .Values.gcp_service_account (not .Values.client.external_server_host) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.k8s_service_account | quote }}
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.gcp_service_account }}
{{- end }}
---
{{- if not .Values.client.external_server_host }}
{{- if ne (default "colocated" .Values.serving_mode) "disaggregated" }}
{{- if not .Values.is_multi_host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-tpu-server"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "{{ .Release.Name }}-tpu-pod"
  template:
    metadata:
      {{- if .Values.gcsfuse.enabled }}
      annotations:
        gke-gcsfuse/volumes: "true"
      {{- end }}
      labels:
        app: "{{ .Release.Name }}-tpu-pod"
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        app.kubernetes.io/component: server
        {{- if .Values.kueue_local_queue }}
        kueue.x-k8s.io/queue-name: {{ .Values.kueue_local_queue | quote }}
        {{- end }}
    spec:
      {{- if eq (int .Values.run_mode) 1 }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.kueue_priority_class }}
      priorityClassName: {{ .Values.kueue_priority_class | quote }}
      {{- end }}
      {{- if .Values.gcp_service_account }}
      serviceAccountName: {{ .Values.k8s_service_account | quote }}
      {{- end }}
      nodeSelector:
      {{- if eq (int .Values.run_mode) 1 }}
        tpu.google.com/slice-name: {{ .Values.tpu_slice_name }}
        tpu.google.com/type: tpu7x
      {{- else }}
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: {{.Values.server.topology}}
        {{- if .Values.gke_reservation }}
        cloud.google.com/reservation-name: {{ .Values.gke_reservation | quote }}
        {{- end }}
        {{- if .Values.placement_policy }}
        cloud.google.com/placement-policy-name: {{ .Values.placement_policy | quote }}
        {{- end }}
      {{- end }}
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
      containers:
      - name: {{ if eq .Values.server.engine_label "TORCH_TPU" }}vllm-torchtpu{{ else }}vllm-tpu{{ end }}
        image: {{.Values.server.image}}
        imagePullPolicy: IfNotPresent
        {{- if eq (int .Values.run_mode) 1 }}
        securityContext:
          privileged: true
        {{- end }}
        command: ["/bin/bash", "-c"]
        args:
        - {{ .Values.server.bash_command | quote }}
        env:
        {{- if eq (int .Values.run_mode) 1 }}
        - name: HF_HUB_OFFLINE
          value: "1"
        {{- else }}
        - name: HF_HOME
          value: /data
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: "{{ .Release.Name }}-hf-secret"
              key: hf_api_token
        {{- end }}
        {{if .Values.server.profile}}
        - name: PHASED_PROFILING_DIR
          value: {{ .Values.server.phased_profiling_dir | default "/tmp/results/profile" | quote }}
        {{end}}
        {{if .Values.server.model_impl_type}}
        - name: MODEL_IMPL_TYPE
          value: {{.Values.server.model_impl_type}}
        {{end}}
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: "{{.Values.server.num_chips_per_node}}"
          requests:
            google.com/tpu: "{{.Values.server.num_chips_per_node}}"
        readinessProbe:
          tcpSocket:
            port: 8000
          {{- if .Values.server.readiness_probe }}
          initialDelaySeconds: {{ .Values.server.readiness_probe.initial_delay_seconds | default 15 }}
          periodSeconds: {{ .Values.server.readiness_probe.period_seconds | default 10 }}
          failureThreshold: {{ .Values.server.readiness_probe.failure_threshold | default 3 }}
          {{- else }}
          initialDelaySeconds: {{ .Values.server.ready_check_timeout_sec | default 15 }}
          periodSeconds: 10
          {{- end }}
        volumeMounts:
        {{- range .Values.custom_volume_mounts }}
        - name: {{ .name }}
          mountPath: {{ .mountPath }}
          {{- if .readOnly }}
          readOnly: {{ .readOnly }}
          {{- end }}
          {{- if .subPath }}
          subPath: {{ .subPath }}
          {{- end }}
        {{- end }}
        {{- range .Values.server.pvc_mounts }}
        - mountPath: {{ .mount_path | quote }}
          name: {{ .volume_name | quote }}
          subPath: {{ tpl .sub_path $ | quote }}
          readOnly: {{ .read_only }}
        {{- end }}
        {{- if ne (int .Values.run_mode) 1 }}
        - mountPath: "/data"
          name: data-volume
        {{- end }}
        - mountPath: /dev/shm
          name: dshm
        {{- if eq (int .Values.run_mode) 1 }}
        - mountPath: /dev/vfio
          name: host-vfio
        {{- end }}
        {{- if .Values.gcsfuse.enabled }}
        {{- range .Values.gcsfuse.volumes }}
        - name: {{ .name }}
          mountPath: {{ .mountPath | quote }}
          readOnly: {{ .readOnly }}
        {{- end }}
        {{- end }}
      volumes:
      {{- range .Values.custom_volume_mounts }}
      - name: {{ .name }}
        persistentVolumeClaim:
          claimName: {{ $.Release.Name }}-{{ .pvcName }}
      {{- end }}
      {{- range .Values.server.pvc_mounts }}
      - name: {{ .volume_name | quote }}
        persistentVolumeClaim:
          claimName: {{ .pvc_name | quote }}
      {{- end }}
      - emptyDir:
          medium: Memory
        name: dshm
      {{- if eq (int .Values.run_mode) 1 }}
      - name: host-vfio
        hostPath:
          path: /dev/vfio
      {{- end }}
      {{- if ne (int .Values.run_mode) 1 }}
      - name: data-volume
        persistentVolumeClaim:
          claimName: "{{ .Release.Name }}-hd-claim"
      {{- end }}
      {{- if .Values.gcsfuse.enabled }}
      {{- range .Values.gcsfuse.volumes }}
      - name: {{ .name }}
        csi:
          driver: gcsfuse.csi.storage.gke.io
          readOnly: {{ .readOnly }}
          volumeAttributes:
            bucketName: {{ .bucketName }}
            mountOptions: {{ .mountOptions | quote }}
            {{- if .volumeAttributes }}
            {{- range $k, $v := .volumeAttributes }}
            {{ $k }}: {{ $v | quote }}
            {{- end }}
            {{- end }}
      {{- end }}
      {{- end }}
{{- else }}
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: "{{ .Release.Name }}-tpu-server"
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: {{ .Values.server.exclusive_topology | default "cloud.google.com/gke-nodepool" | quote }}
  labels:
    {{- if .Values.kueue_local_queue }}
    kueue.x-k8s.io/queue-name: {{ .Values.kueue_local_queue | quote }}
    {{- end }}
spec:
  replicas: 1
  rolloutStrategy:
    type: "RollingUpdate"
  leaderWorkerTemplate:
    size: {{ .Values.server.num_nodes }}
    restartPolicy: RecreateGroupOnPodRestart
    {{- if not .Values.kueue_local_queue }}
    leaderTemplate:
      metadata:
        {{- if .Values.gcsfuse.enabled }}
