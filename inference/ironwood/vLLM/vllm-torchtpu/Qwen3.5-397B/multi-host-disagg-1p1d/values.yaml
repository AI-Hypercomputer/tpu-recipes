"proxy":
  "bash_command": "cat > /tmp/disagg_proxy_server.py <<'BENCH_PROXY_EOF'\n# Portions\
    \ of this file are derived from vLLM\n# (https://github.com/vllm-project/vllm),\
    \ specifically\n# tests/v1/kv_connector/nixl_integration/toy_proxy_server.py,\
    \ which is licensed\n# under the Apache License, Version 2.0. The upstream copyright\
    \ and license are\n# retained by their owners; see\n# https://github.com/vllm-project/vllm/blob/main/LICENSE.\n\
    \"\"\"Disaggregated-serving HTTP proxy for vLLM prefill/decode (P/D) pools.\n\n\
    Adapted from vLLM's disaggregated-serving toy proxy\n(tests/v1/kv_connector/nixl_integration/toy_proxy_server.py,\
    \ Apache-2.0). It is\nconnector-agnostic: it forwards ``kv_transfer_params`` between\
    \ the prefill and\ndecode pools, so it works with both the TPU (TPUConnector)\
    \ and GPU\n(NixlConnector) native P/D paths. This recipe ships this file and runs\
    \ it in the\nproxy pod, so it does not depend on the script being present in the\
    \ serving\nimage.\n\nRequest flow: send the prompt to a prefill instance with\
    \ ``max_tokens=1`` to\npopulate the KV cache, capture the returned ``kv_transfer_params``,\
    \ then stream\nthe full generation from a decode instance. Instances are selected\
    \ round-robin.\n\"\"\"\n\nimport argparse\nimport asyncio\nimport codecs\nimport\
    \ collections.abc\nimport contextlib\nimport itertools\nimport logging\nimport\
    \ os\nimport time\nfrom typing import Any\nimport uuid\n\nimport fastapi\nfrom\
    \ fastapi import responses\nimport httpx\n\nlogging.basicConfig(level=logging.INFO)\n\
    logger = logging.getLogger(\"disagg_proxy_server\")\n\n\n# Startup waits up to\
    \ this long for every prefill/decode backend to report\n# healthy before the proxy\
    \ begins serving requests.\n_BACKEND_READY_TIMEOUT_S = 90 * 60\n_BACKEND_POLL_INTERVAL_S\
    \ = 10\n\n\nasync def _backend_healthy(client_info: dict[str, Any]) -> bool:\n\
    \  \"\"\"Returns True if the backend's /health endpoint returns HTTP 200.\"\"\"\
    \n  url = f\"http://{client_info['host']}:{client_info['port']}/health\"\n  try:\n\
    \    response = await client_info[\"client\"].get(url, timeout=5.0)\n    return\
    \ response.status_code == 200\n  except httpx.HTTPError:\n    return False\n\n\
    \nasync def _all_backends_healthy(fastapi_app: fastapi.FastAPI) -> bool:\n  \"\
    \"\"Returns True only if every prefill and decode backend is healthy.\"\"\"\n\
    \  clients = fastapi_app.state.prefill_clients + fastapi_app.state.decode_clients\n\
    \  results = await asyncio.gather(*(_backend_healthy(c) for c in clients))\n \
    \ return all(results)\n\n\nasync def _wait_for_backends_ready(fastapi_app: fastapi.FastAPI)\
    \ -> None:\n  \"\"\"Blocks startup until all backends are healthy or the timeout\
    \ elapses.\n\n  The proxy binds its port before the backends finish loading weights,\
    \ so\n  without this the client would fire requests at cold backends and get zero\n\
    \  successes. Staying in startup keeps the client's readiness probe waiting.\n\
    \n  Args:\n    fastapi_app: The FastAPI app whose prefill/decode pools are polled.\n\
    \  \"\"\"\n  deadline = time.monotonic() + _BACKEND_READY_TIMEOUT_S\n  while True:\n\
    \    if await _all_backends_healthy(fastapi_app):\n      logger.info(\"All prefill/decode\
    \ backends are ready.\")\n      return\n    if time.monotonic() >= deadline:\n\
    \      logger.warning(\n          \"Timed out after %ds waiting for backends;\
    \ serving anyway.\",\n          _BACKEND_READY_TIMEOUT_S,\n      )\n      return\n\
    \    logger.info(\"Waiting for prefill/decode backends to become ready...\")\n\
    \    await asyncio.sleep(_BACKEND_POLL_INTERVAL_S)\n\n\n@contextlib.asynccontextmanager\n\
    async def lifespan(\n    fastapi_app: fastapi.FastAPI,\n) -> collections.abc.AsyncIterator[None]:\n\
    \  \"\"\"Initializes and tears down the prefill/decode client pools.\"\"\"\n \
    \ cli_args = fastapi_app.state.cli_args\n  fastapi_app.state.prefill_clients =\
    \ []\n  fastapi_app.state.decode_clients = []\n\n  for i, (host, port) in enumerate(cli_args.prefiller_instances):\n\
    \    fastapi_app.state.prefill_clients.append({\n        \"client\": httpx.AsyncClient(\n\
    \            timeout=None, base_url=f\"http://{host}:{port}/v1\"\n        ),\n\
    \        \"host\": host,\n        \"port\": port,\n        \"id\": i,\n    })\n\
    \n  for i, (host, port) in enumerate(cli_args.decoder_instances):\n    fastapi_app.state.decode_clients.append({\n\
    \        \"client\": httpx.AsyncClient(\n            timeout=None, base_url=f\"\
    http://{host}:{port}/v1\"\n        ),\n        \"host\": host,\n        \"port\"\
    : port,\n        \"id\": i,\n    })\n\n  fastapi_app.state.prefill_iterator =\
    \ itertools.cycle(\n      range(len(fastapi_app.state.prefill_clients))\n  )\n\
    \  fastapi_app.state.decode_iterator = itertools.cycle(\n      range(len(fastapi_app.state.decode_clients))\n\
    \  )\n  logger.info(\n      \"Initialized %d prefill and %d decode clients.\"\
    ,\n      len(fastapi_app.state.prefill_clients),\n      len(fastapi_app.state.decode_clients),\n\
    \  )\n\n  await _wait_for_backends_ready(fastapi_app)\n\n  yield\n\n  for client_info\
    \ in fastapi_app.state.prefill_clients:\n    await client_info[\"client\"].aclose()\n\
    \  for client_info in fastapi_app.state.decode_clients:\n    await client_info[\"\
    client\"].aclose()\n\n\napp = fastapi.FastAPI(lifespan=lifespan)\n\n\ndef _response_media_type(req_data:\
    \ dict[str, Any]) -> str:\n  \"\"\"Returns the Content-Type the client must see\
    \ for this request.\n\n  vLLM answers ``\"stream\": true`` with Server-Sent Events.\
    \ Strict OpenAI\n  clients (e.g. the InferenceX AIPerf harness) only run their\
    \ SSE parser when\n  the response is ``text/event-stream``; advertising ``application/json``\
    \ makes\n  them fail every streamed request with a JSON decode error on ``data:\
    \ ...``.\n\n  Args:\n    req_data: The sanitized request body forwarded to decode.\n\
    \n  Returns:\n    ``text/event-stream`` for streaming requests, else ``application/json``.\n\
    \  \"\"\"\n  return \"text/event-stream\" if req_data.get(\"stream\") else \"\
    application/json\"\n\n\ndef _build_headers(request_id: str) -> dict[str, str]:\n\
    \  \"\"\"Builds forwarding headers, adding auth only when a key is set.\"\"\"\n\
    \  headers = {\"X-Request-Id\": request_id}\n  api_key = os.environ.get(\"OPENAI_API_KEY\"\
    )\n  if api_key:\n    headers[\"Authorization\"] = f\"Bearer {api_key}\"\n  return\
    \ headers\n\n\ndef _sanitize_request_body(req_data: Any) -> dict[str, Any]:\n\
    \  \"\"\"Requires a JSON object and drops client-supplied ``kv_transfer_params``.\n\
    \n  ``kv_transfer_params`` sets the ``remote_host``/``remote_port`` the decode\n\
    \  backend dials, so forwarding a client value would enable SSRF (CWE-918); the\n\
    \  proxy re-injects only what the prefill backend returns.\n\n  Args:\n    req_data:\
    \ The parsed JSON request body.\n\n  Returns:\n    ``req_data`` with ``kv_transfer_params``\
    \ removed.\n\n  Raises:\n    fastapi.HTTPException: If the body is not a JSON\
    \ object.\n  \"\"\"\n  if not isinstance(req_data, dict):\n    raise fastapi.HTTPException(\n\
    \        status_code=400, detail=\"Request body must be a JSON object.\"\n   \
    \ )\n  req_data.pop(\"kv_transfer_params\", None)\n  return req_data\n\n\ndef\
    \ parse_args() -> argparse.Namespace:\n  \"\"\"Parses proxy CLI args (prefiller/decoder\
    \ host+port lists).\"\"\"\n  parser = argparse.ArgumentParser()\n  parser.add_argument(\"\
    --port\", type=int, default=8000)\n  parser.add_argument(\"--host\", type=str,\
    \ default=\"localhost\")\n  parser.add_argument(\n      \"--prefiller-hosts\"\
    ,\n      \"--prefiller-host\",\n      type=str,\n      nargs=\"+\",\n      default=[\"\
    localhost\"],\n  )\n  parser.add_argument(\n      \"--prefiller-ports\",\n   \
    \   \"--prefiller-port\",\n      type=int,\n      nargs=\"+\",\n      default=[8100],\n\
    \  )\n  parser.add_argument(\n      \"--decoder-hosts\",\n      \"--decoder-host\"\
    ,\n      type=str,\n      nargs=\"+\",\n      default=[\"localhost\"],\n  )\n\
    \  parser.add_argument(\n      \"--decoder-ports\",\n      \"--decoder-port\"\
    ,\n      type=int,\n      nargs=\"+\",\n      default=[8200],\n  )\n  args = parser.parse_args()\n\
    \n  if len(args.prefiller_hosts) != len(args.prefiller_ports):\n    raise ValueError(\"\
    Number of prefiller hosts must match prefiller ports.\")\n  if len(args.decoder_hosts)\
    \ != len(args.decoder_ports):\n    raise ValueError(\"Number of decoder hosts\
    \ must match decoder ports.\")\n\n  args.prefiller_instances = list(\n      zip(args.prefiller_hosts,\
    \ args.prefiller_ports)\n  )\n  args.decoder_instances = list(zip(args.decoder_hosts,\
    \ args.decoder_ports))\n  return args\n\n\ndef get_next_client(\n    fastapi_app:\
    \ fastapi.FastAPI, service_type: str\n) -> dict[str, Any]:\n  \"\"\"Returns the\
    \ next prefill/decode client in round-robin order.\"\"\"\n  if service_type ==\
    \ \"prefill\":\n    return fastapi_app.state.prefill_clients[\n        next(fastapi_app.state.prefill_iterator)\n\
    \    ]\n  if service_type == \"decode\":\n    return fastapi_app.state.decode_clients[\n\
    \        next(fastapi_app.state.decode_iterator)\n    ]\n  raise ValueError(f\"\
    Unknown service type: {service_type}\")\n\n\nasync def send_request_to_prefill(\n\
    \    client_info: dict[str, Any],\n    endpoint: str,\n    req_data: dict[str,\
    \ Any],\n    request_id: str,\n) -> httpx.Response:\n  \"\"\"Runs prefill (max_tokens=1)\
    \ and returns the response with kv params.\"\"\"\n  req_data = req_data.copy()\n\
    \  req_data[\"kv_transfer_params\"] = {\n      \"do_remote_decode\": True,\n \
    \     \"do_remote_prefill\": False,\n      \"remote_engine_id\": None,\n     \
    \ \"remote_block_ids\": None,\n      \"remote_host\": None,\n      \"remote_port\"\
    : None,\n  }\n  req_data[\"stream\"] = False\n  req_data[\"max_tokens\"] = 1\n\
    \  if \"max_completion_tokens\" in req_data:\n    req_data[\"max_completion_tokens\"\
    ] = 1\n  req_data.pop(\"stream_options\", None)\n  headers = _build_headers(request_id)\n\
    \  response = await client_info[\"client\"].post(\n      endpoint, json=req_data,\
    \ headers=headers\n  )\n  response.raise_for_status()\n  return response\n\n\n\
    def _json_escape_non_ascii(text: str) -> bytes:\n  \"\"\"Encodes text as ASCII\
    \ bytes while preserving JSON string semantics.\"\"\"\n  if text.isascii():\n\
    \    return text.encode(\"ascii\")\n\n  parts = []\n  for char in text:\n    codepoint\
    \ = ord(char)\n    if codepoint < 128:\n      parts.append(char)\n    elif codepoint\
    \ <= 0xFFFF:\n      parts.append(f\"\\\\u{codepoint:04x}\")\n    else:\n     \
    \ codepoint -= 0x10000\n      high_surrogate = 0xD800 + (codepoint >> 10)\n  \
    \    low_surrogate = 0xDC00 + (codepoint & 0x3FF)\n      parts.append(f\"\\\\\
    u{high_surrogate:04x}\\\\u{low_surrogate:04x}\")\n  return \"\".join(parts).encode(\"\
    ascii\")\n\n\nclass _AsciiSafeStreamEncoder:\n  \"\"\"Converts UTF-8 stream chunks\
    \ to ASCII-only JSON-compatible chunks.\"\"\"\n\n  def __init__(self) -> None:\n\
    \    self._decoder = codecs.getincrementaldecoder(\"utf-8\")()\n\n  def encode(self,\
    \ chunk: bytes = b\"\", *, final: bool = False) -> bytes:\n    text = self._decoder.decode(chunk,\
    \ final=final)\n    if not text:\n      return b\"\"\n    return _json_escape_non_ascii(text)\n\
    \n\nasync def stream_from_decode(\n    client_info: dict[str, Any],\n    endpoint:\
    \ str,\n    req_data: dict[str, Any],\n    request_id: str,\n) -> collections.abc.AsyncIterator[bytes]:\n\
    \  \"\"\"Streams the decode response chunks back to the caller.\"\"\"\n  headers\
    \ = _build_headers(request_id)\n  async with client_info[\"client\"].stream(\n\
    \      \"POST\", endpoint, json=req_data, headers=headers\n  ) as response:\n\
    \    response.raise_for_status()\n    encoder = _AsciiSafeStreamEncoder()\n  \
    \  async for chunk in response.aiter_bytes():\n      encoded = encoder.encode(chunk)\n\
    \      if encoded:\n        yield encoded\n    tail = encoder.encode(final=True)\n\
    \    if tail:\n      yield tail\n\n\nasync def _handle_completions(\n    api:\
    \ str, request: fastapi.Request\n) -> responses.StreamingResponse:\n  \"\"\"Orchestrates\
    \ a prefill-then-decode round trip for one request.\"\"\"\n  request_id = str(uuid.uuid4())\n\
    \  try:\n    req_data = _sanitize_request_body(await request.json())\n    prefill_client\
    \ = get_next_client(request.app, \"prefill\")\n    response = await send_request_to_prefill(\n\
    \        prefill_client, api, req_data, request_id\n    )\n    kv_transfer_params\
    \ = response.json().get(\"kv_transfer_params\", {})\n    if kv_transfer_params:\n\
    \      req_data[\"kv_transfer_params\"] = kv_transfer_params\n\n    decode_client\
    \ = get_next_client(request.app, \"decode\")\n  except fastapi.HTTPException:\n\
    \    raise\n  except Exception:\n    logger.exception(\"Error in disagg proxy\
    \ for %s endpoint\", api)\n    raise\n\n  async def generate_stream() -> collections.abc.AsyncIterator[bytes]:\n\
    \    async for chunk in stream_from_decode(\n        decode_client, api, req_data,\
    \ request_id\n    ):\n      yield chunk\n\n  return responses.StreamingResponse(\n\
    \      generate_stream(), media_type=_response_media_type(req_data)\n  )\n\n\n\
    @app.post(\"/v1/completions\")\nasync def handle_completions(\n    request: fastapi.Request,\n\
    ) -> responses.StreamingResponse:\n  return await _handle_completions(\"/completions\"\
    , request)\n\n\n@app.post(\"/v1/chat/completions\")\nasync def handle_chat_completions(\n\
    \    request: fastapi.Request,\n) -> responses.StreamingResponse:\n  return await\
    \ _handle_completions(\"/chat/completions\", request)\n\n\n@app.get(\"/healthcheck\"\
    )\nasync def healthcheck() -> dict[str, Any]:\n  return {\n      \"status\": \"\
    ok\",\n      \"prefill_instances\": len(app.state.prefill_clients),\n      \"\
    decode_instances\": len(app.state.decode_clients),\n  }\n\n\n@app.get(\"/health\"\
    )\n@app.get(\"/ping\")\nasync def health() -> responses.Response:\n  \"\"\"Readiness\
    \ endpoint: 200 only once all backends can serve.\n\n  The client polls this before\
    \ sending load, so returning non-200 until the\n  prefill/decode pools are ready\
    \ prevents premature, failing requests.\n  \"\"\"\n  if await _all_backends_healthy(app):\n\
    \    return responses.JSONResponse({\"status\": \"ok\"})\n  return responses.JSONResponse(\n\
    \      {\"status\": \"backends_not_ready\"}, status_code=503\n  )\n\n\n@app.get(\"\
    /v1/models\")\nasync def models() -> responses.Response:\n  \"\"\"Proxies the\
    \ model list from a prefill backend (used by readiness checks).\"\"\"\n  client_info\
