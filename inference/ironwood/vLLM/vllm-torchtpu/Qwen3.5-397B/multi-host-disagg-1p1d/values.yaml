"decode":
  "bash_command": "echo 'Prewarming trust_remote_code module cache (single process)\
    \ to avoid concurrent dynamic-module import race...'; python3 -c 'import sys\n\
    import transformers\nmodel_id = '\"'\"'gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8'\"\
    '\"'\ntransformers.AutoConfig.from_pretrained(model_id, trust_remote_code=True)\n\
    transformers.AutoTokenizer.from_pretrained(\n    model_id, trust_remote_code=True\n\
    )\ntry:\n  transformers.AutoProcessor.from_pretrained(\n      model_id, trust_remote_code=True\n\
    \  )\nexcept Exception as e:\n  print(\"prewarm: processor skipped:\", e, file=sys.stderr)\n\
    print(\"prewarm: remote-code module cache ready\", file=sys.stderr)\n' || echo\
    \ 'prewarm failed; continuing';\nif [ -d gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8\
    \ ]; then\n  mnt_point=$(df -P gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8\
    \ 2>/dev/null | tail -n 1 | awk '{print $NF}')\n  if mount | grep -q \"on ${mnt_point}\
    \ type lustre\"; then\n    echo \"BENCH_MODEL_WEIGHTS_SIZE: \"$(du -sk gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8\
    \ 2>/dev/null | awk '{printf \"%.2fGiB\\n\", $1/1024/1024}')\n  else\n    echo\
    \ \"Model is not on Lustre, skipping du in container logs\"\n  fi\nfi\nVLLM_LOGGING_LEVEL=INFO\
    \ HF_HOME=/data/huggingface_cache HF_HUB_DISABLE_XET=1 TMPDIR=/data/tmp VLLM_ENGINE_READY_TIMEOUT_S=7200\
    \ JAX_PLATFORMS=tpu,cpu PJRT_DEVICE=TPU TPU_BACKEND_TYPE=jax VLLM_TARGET_DEVICE=tpu\
    \ MODEL_IMPL_TYPE=vllm NEW_MODEL_DESIGN=0 SKIP_JAX_PRECOMPILE=1 VLLM_XLA_CHECK_RECOMPILATION=0\
    \ VLLM_XLA_CACHE_PATH=/dev/shm/xla_cache TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE=disabled\
    \ TORCH_TPU_INTERNAL_TIER3_COMPILATION_CACHE_ROOT=/dev/shm/xla_cache/torch_tpu_tier3\
    \ TORCHINDUCTOR_MAX_WORKERS=4 TORCHINDUCTOR_AUTOGRAD_CACHE=0 OMP_NUM_THREADS=8\
    \ XLA_PYTHON_CLIENT_PREALLOCATE=false VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 LIBTPU_INIT_ARGS='\
    \ --xla_tpu_use_minor_sharding_for_major_trivial_input=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false\
    \ --xla_tpu_ars_combiner_threshold_in_bytes=0 --xla_tpu_enable_async_collective_merger=false\
    \ --xla_enable_async_all_gather=true --xla_tpu_enable_sparse_core_collective_offload_all_gather=true\
    \ --xla_tpu_sparse_core_all_gather_offload_min_size_in_bytes=262144' USE_MOE_FUSED_EP_KERNEL=1\
    \ USE_MOE_COUNTING_SORT=1 USE_MOE_SPARSE_CORE=1 USE_FUSED_MOE_GMM=1 USE_BATCHED_RPA_KERNEL=1\
    \ TPU_MOE_FUSED_EP_STEP_MIN_TOKENS=33 TPU_MOE_FUSED_EP_ASYNC_ROW_GATHER=1 TPU_MOE_SKIP_PADDED_TOKENS=0\
    \ MOE_FUSED_EP_KERNEL_MIN_TOKENS=1024 MOE_LOCAL_EXPERT_AFFINITY_EPSILON=0.01 VLLM_MOE_CHUNK_SIZE=256\
    \ ONEHOT_MOE_PERMUTE_THRESHOLD=2048 RAGGED_GATHER_REDUCE_VERSION=v3 RAGGED_GATED_DELTA_RULE_IMPL=chunked_kernel_v3_pd\
    \ TPU_ENABLE_GDN_DYNAMIC_TILING=0 TPU_GDN_CONV_QK_PAIR_LAYOUT=1 TPU_GDN_CONV_STATE_TILE_PAD=1\
    \ TPU_RPA_FOLD_KV_HEAD_DIM=0 TPU_ROPE_CACHE_TRUNCATE=1 TPUMISC_HMA_CHECKSUM_TRACE=0\
    \ DP_SCHED_BATCH_PREFILL_MAX_ADMIT_PER_FLUSH=0 TPU_VLLM_ENABLE_UNIFIED_BLOCK_POOL=1\
    \ TPU_USE_RAIDEN_KV_CACHE_MANAGER=1 TPU_RAIDEN_QWEN35_ADMISSION=1 TPU_KV_RESHARD_TRANSPORT=raiden\
    \ TPU_RAIDEN_RESHARD_IMPL=store TPU_RAIDEN_CLIENT_IMPL=cpp TPU_RAIDEN_TRANSFER_PARALLELISM=8\
    \ TPU_RAIDEN_MAX_TRANSFER_TOKENS=262144 TPU_PREMAPPED_BUFFER_SIZE=17179869184\
    \ TPU_KV_CACHE_HEADROOM_MIB=6144 TPU_KV_RESHARD_DST_PAGE_TOKENS=4096 TPU_ENABLE_D2H_TRANSFER=1\
    \ TPU_HMA_D2H_COPY_IMPL=device_put TPU_HMA_MIN_DONE_RECVING_BATCH=1 TPU_HMA_MAX_DONE_RECVING_BATCH=1\
    \ TPU_HMA_MAX_INFLIGHT_D2H_SENDS=1 TPU_HMA_MAX_INFLIGHT_PULLS=8 TPU_MAX_HOST_KV_BUFFER_SIZE=64\
