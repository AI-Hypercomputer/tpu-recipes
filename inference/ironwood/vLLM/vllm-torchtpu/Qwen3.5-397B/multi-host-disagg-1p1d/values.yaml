"client":
  "bash_command": "#!/bin/bash\n# InferenceX AgentX harness (CDK recipe agentx-397b-pd-baseline\
    \ parity).\nAIPERF_BIN=/root/aiperf-venv/bin/aiperf\nHF_CLI=/root/aiperf-venv/bin/hf\n\
    AIPERF_PYTHON=/root/aiperf-venv/bin/python\n[ -x \"${HF_CLI}\" ] || HF_CLI=hf\n\
    [ -x \"${AIPERF_PYTHON}\" ] || AIPERF_PYTHON=python3\nexport VLLM_PLUGINS=\"\"\
    \nexport VLLM_TARGET_DEVICE=\"empty\"\nexport JAX_PLATFORMS=\"cpu\"\nexport TPU_PJRT_EVENT_TRACE_ENABLE=\"\
    0\"\nexport AIPERF_DATASET_WEKA_LIVE_ASSISTANT_RESPONSES=0\nexport AIPERF_DATASET_CONFIGURATION_TIMEOUT=1800\n\
    export AIPERF_SERVICE_PROFILE_CONFIGURE_TIMEOUT=1800\nexport AIPERF_UI_REALTIME_METRICS_ENABLED=true\n\
    export BENCH_CLIENT_CONCURRENCY=32\nif [ -n \"${HF_TOKEN:-}\" ]; then export HUGGING_FACE_HUB_TOKEN=\"\
    ${HF_TOKEN}\"; fi\nunset HF_HUB_OFFLINE TRANSFORMERS_OFFLINE\nrm -f /tmp/libtpu_lockfile*\
    \ /dev/shm/libtpu_lockfile* 2>/dev/null || true\n\"${AIPERF_PYTHON}\" -c 'import\
    \ importlib.metadata as m; print(\"aiperf\", m.version(\"aiperf\"))' || true\n\
    \necho \"--- PRE-DOWNLOADING TOKENIZER ---\"\nif [ ! -d Qwen/Qwen3.5-397B-A17B-FP8\
    \ ]; then\n  \"${HF_CLI}\" download Qwen/Qwen3.5-397B-A17B-FP8 --include \"tokenizer*\"\
    \ || true\n  \"${HF_CLI}\" download Qwen/Qwen3.5-397B-A17B-FP8 config.json ||\
    \ true\nfi\n\necho \"--- WAITING FOR OPENAI SERVER TO BE READY ---\"\nwhile !\
    \ \"${AIPERF_PYTHON}\" -c '\nimport urllib.request, json, sys, os\nhost = os.environ[\"\
    SERVER_HOSTNAME\"]\nreq = urllib.request.Request(f\"http://{host}:8000/v1/chat/completions\"\
    , data=json.dumps({\"model\": \"gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8\"\
    , \"messages\": [{\"role\": \"user\", \"content\": \"warmup\"}], \"max_tokens\"\
    : 1}).encode(\"utf-8\"), headers={\"Content-Type\": \"application/json\"})\ntry:\n\
    \  with urllib.request.urlopen(req) as response:\n    if \"choices\" in json.loads(response.read().decode()):\
    \ sys.exit(0)\nexcept Exception: pass\nsys.exit(1)'; do\n  sleep 3\n  echo 'Waiting\
    \ for OpenAI server at http://'\"${SERVER_HOSTNAME}\"':8000 to respond...'\ndone\n\
    \necho \"--- SERVING ENGINE 100% READY, SETTLING (10s) ---\"\nsleep 10\n\nPREFIX_CACHE_URLS=(http://${SERVER_HOSTNAME/-vllm-proxy./-vllm-prefill.}:8000)\n\
    scrape_prefix_cache() {\n  \"${AIPERF_PYTHON}\" - \"$@\" <<'PYEOF' 2>/dev/null\
    \ || echo \"0 0\"\nimport sys, urllib.request\ntotals = {\"vllm:prefix_cache_hits_total\"\
    : 0.0,\n          \"vllm:prefix_cache_queries_total\": 0.0}\nfor url in sys.argv[1:]:\n\
    \  try:\n    with urllib.request.urlopen(url.rstrip(\"/\") + \"/metrics\", timeout=10)\
    \ as r:\n      text = r.read().decode(\"utf-8\", \"replace\")\n  except Exception:\n\
    \    continue\n  for line in text.splitlines():\n    fields = line.split()\n \
    \   if len(fields) < 2 or line.startswith(\"#\"):\n      continue\n    name =\
    \ fields[0].split(\"{\", 1)[0]\n    if name in totals:\n      try:\n        totals[name]\
    \ += float(fields[-1])\n      except ValueError:\n        pass\nprint(\"%.0f %.0f\"\
    \ % (totals[\"vllm:prefix_cache_hits_total\"],\n                     totals[\"\
    vllm:prefix_cache_queries_total\"]))\nPYEOF\n}\nread -r PREFIX_CACHE_HITS_START\
    \ PREFIX_CACHE_QUERIES_START < <(scrape_prefix_cache \"${PREFIX_CACHE_URLS[@]}\"\
    )\necho \"prefix cache counters (start): hits=${PREFIX_CACHE_HITS_START} queries=${PREFIX_CACHE_QUERIES_START}\"\
    \necho \"--- RUNNING AIPERF BENCHMARK ---\"\n\"${AIPERF_BIN}\" profile \\\n  \
    \  --scenario inferencex-agentx-mvp \\\n    --url \"http://${SERVER_HOSTNAME}:8000\"\
    \ \\\n    --endpoint /v1/chat/completions \\\n    --endpoint-type chat \\\n  \
    \  --streaming \\\n    --model gs://<YOUR_MODEL_BUCKET>/Qwen3.5-397B-A17B-FP8\
    \ \\\n    --tokenizer Qwen/Qwen3.5-397B-A17B-FP8 \\\n    --concurrency 32 \\\n\
    \    --benchmark-duration 3600 \\\n    --stats-interval 30 \\\n    --random-seed\
    \ 42 \\\n    --failed-request-threshold 0.25 \\\n    --trajectory-start-min-ratio\
    \ 0.25 \\\n    --trajectory-start-max-ratio 0.75 \\\n    --warmup-requests-per-lane\
    \ 10 \\\n    --trace-idle-gap-cap-seconds 300 \\\n    --warmup-grace-period 1800\
    \ \\\n    --use-server-token-count \\\n    --no-gpu-telemetry \\\n    --tokenizer-trust-remote-code\
    \ \\\n    --num-dataset-entries 393 \\\n    --slice-duration 1.0 \\\n    --output-artifact-dir\
    \ /tmp/aiperf_results \\\n    --public-dataset semianalysis_cc_traces_weka_062126_256k\n\
    AIPERF_RC=$?\necho \"aiperf exit code: ${AIPERF_RC}\"\nread -r PREFIX_CACHE_HITS_END\
    \ PREFIX_CACHE_QUERIES_END < <(scrape_prefix_cache \"${PREFIX_CACHE_URLS[@]}\"\
    )\necho \"prefix cache counters (end): hits=${PREFIX_CACHE_HITS_END} queries=${PREFIX_CACHE_QUERIES_END}\"\
    \nexport PREFIX_CACHE_SCRAPED=1 PREFIX_CACHE_HITS_START PREFIX_CACHE_QUERIES_START\
    \ PREFIX_CACHE_HITS_END PREFIX_CACHE_QUERIES_END\n\necho \"--- BENCHMARK COMPLETED\
    \ ---\"\nmkdir -p /tmp/results\ncp -r /tmp/aiperf_results/* /tmp/results/ 2>/dev/null\
    \ || true\n# Print raw metrics summary\ncat /tmp/aiperf_results/profile_export_aiperf.json\
    \ 2>/dev/null || cat /tmp/aiperf_results/*/profile_export_aiperf.json 2>/dev/null\
    \ || true\necho \"\"\necho \"--- SERVER METRICS ---\"\n\"${AIPERF_PYTHON}\" -\
    \ <<'PYEOF' 2>/dev/null || true\nimport glob, json, os, re\nhost = os.environ.get(\"\
    SERVER_HOSTNAME\", \"\")\nkeep = re.compile(r\"prefix_cache|cached_tokens|prompt_tokens\"\
    )\nout = {}\npaths = sorted(glob.glob(\"/tmp/aiperf_results/server_metrics_export.json\"\
    )\n               + glob.glob(\"/tmp/aiperf_results/*/server_metrics_export.json\"\
    ))\ntry:\n  with open(paths[0]) as f:\n    data = json.load(f)\nexcept Exception:\n\
    \  data = {}\nfor name, metric in (data.get(\"metrics\") or {}).items():\n  if\
    \ not keep.search(name) or not isinstance(metric, dict):\n    continue\n  series\
    \ = [\n      {k: v for k, v in s.items() if k != \"timeslices\"}\n      for s\
    \ in metric.get(\"series\") or []\n      if isinstance(s, dict) and host in (s.get(\"\
    endpoint_url\") or \"\")\n  ]\n  if series:\n    out[name] = {\"series\": series}\n\
    result = {\"metrics\": out}\nif os.environ.get(\"PREFIX_CACHE_SCRAPED\") == \"\
    1\":\n  hits = int(float(os.environ[\"PREFIX_CACHE_HITS_END\"])\n            \
    \ - float(os.environ[\"PREFIX_CACHE_HITS_START\"]))\n  queries = int(float(os.environ[\"\
    PREFIX_CACHE_QUERIES_END\"])\n                - float(os.environ[\"PREFIX_CACHE_QUERIES_START\"\
    ]))\n  result[\"prefix_cache_hits\"] = hits\n  result[\"prefix_cache_queries\"\
    ] = queries\n  result[\"prefix_cache_hit_rate\"] = (\n      round(hits / queries,\
    \ 4) if queries > 0 else None)\nprint(json.dumps(result))\nPYEOF\necho \"--- END\
    \ OF METRICS ---\"\n\"${AIPERF_PYTHON}\" - <<'PYEOF' 2>/dev/null || true\nimport\
    \ glob, json, os\npaths = sorted(glob.glob(\"/tmp/aiperf_results/profile_export_aiperf.json\"\
    )\n               + glob.glob(\"/tmp/aiperf_results/*/profile_export_aiperf.json\"\
    ))\ntry:\n  with open(paths[0]) as f:\n    d = json.load(f)\nexcept Exception:\n\
    \  d = {}\ndef g(key, stat=\"avg\"):\n  value = d.get(key)\n  return value.get(stat)\
    \ if isinstance(value, dict) else None\nout = {}\ndur, n = g(\"benchmark_duration\"\
    ), g(\"request_count\")\nisl, osl = g(\"input_sequence_length\"), g(\"output_sequence_length\"\
    )\nif dur and n and isl is not None and osl is not None:\n  out[\"total_token_throughput\"\
    ] = round(n * (isl + osl) / dur, 4)\n  out[\"input_throughput\"] = round(n * isl\
    \ / dur, 4)\n  out[\"output_throughput\"] = round(n * osl / dur, 4)\n  out[\"\
    benchmark_duration_s\"] = dur\nitl = g(\"inter_token_latency\", \"p50\")\nif itl:\n\
    \  out[\"median_tpot_ms\"] = itl\n  out[\"interactivity\"] = round(1000.0 / itl,\
    \ 4)\nfor key, stat, dst in ((\"time_to_first_token\", \"avg\", \"mean_ttft_ms\"\
    ),\n                       (\"time_to_first_token\", \"p50\", \"median_ttft_ms\"\
    ),\n                       (\"request_latency\", \"p50\", \"median_e2el_ms\")):\n\
    \  if g(key, stat) is not None:\n    out[dst] = g(key, stat)\nout[\"num_requests_successful\"\
    ] = n\nout[\"aiperf_native_total_token_throughput\"] = g(\"total_token_throughput\"\
    )\nout[\"effective_concurrency\"] = g(\"effective_concurrency\")\nif os.environ.get(\"\
    PREFIX_CACHE_SCRAPED\") == \"1\":\n  h = float(os.environ[\"PREFIX_CACHE_HITS_END\"\
    ]) - float(\n      os.environ[\"PREFIX_CACHE_HITS_START\"])\n  q = float(os.environ[\"\
    PREFIX_CACHE_QUERIES_END\"]) - float(\n      os.environ[\"PREFIX_CACHE_QUERIES_START\"\
    ])\n  out[\"prefix_cache_hits\"] = int(h)\n  out[\"prefix_cache_queries\"] = int(q)\n\
    \  out[\"prefix_cache_hit_rate\"] = round(h / q, 4) if q > 0 else None\nout[\"\
    concurrency_level\"] = int(os.environ.get(\"BENCH_CLIENT_CONCURRENCY\") or 0)\n\
    print(\"CDK_STYLE_METRICS=\" + json.dumps(out))\nPYEOF\nsync\necho \"--- SLEEPING\
    \ 60s FOR LOG HARVESTING ---\"\nsleep 60\n"
