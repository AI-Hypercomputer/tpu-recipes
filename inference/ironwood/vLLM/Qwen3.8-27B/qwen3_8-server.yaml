apiVersion: v1
kind: Namespace
metadata:
  name: vllm-qwen38
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hyperdisk-balanced-qwen38
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hd-claim-qwen38
  namespace: vllm-qwen38
spec:
  storageClassName: hyperdisk-balanced-qwen38
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen38
  namespace: vllm-qwen38
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-qwen38
  template:
    metadata:
      labels:
        app: vllm-qwen38
    spec:
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x1
      containers:
      - name: vllm-tpu
        # Requires a build with the GDN v3 decode kernel (>= nightly-20260816).
        # Older builds (GDN v2, e.g. June nightlies) fail Mosaic compilation for
        # this model's linear-attention head geometry on TPU7x:
        #   "Not implemented: Lane broadcast" in gdn/v2/gdn_decode_kernel.py
        image: vllm/vllm-tpu:nightly-20260816-11250b4-1d2d83a
        command: ["vllm", "serve"]
        args:
        - --host=0.0.0.0
        - --port=8000
        - --model=Qwen/Qwen3.8-27B
        - --tokenizer=Qwen/Qwen3.8-27B
        - --tensor-parallel-size=8
        - --kv-cache-dtype=fp8
        - --max-model-len=16384
        - --gpu-memory-utilization=0.9
        - --max-num-seqs=256
        - --max-num-batched-tokens=1024
        - --no-enable-prefix-caching
        - --reasoning-parser=qwen3
        # Keep the vision tower loaded (~0.8 GB): do NOT add --language-model-only.
        # Current TPU builds precompile the vision encoder for multimodal
        # architectures regardless of that flag, and crash at warmup with
        # StageMissingLayer(vision_tower) when the weights were skipped.
        - '--limit-mm-per-prompt={"image": 0, "video": 0}'
        - --block-size=256
        - --download-dir=/data
        env:
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "1800"
        - name: MODEL_IMPL_TYPE
          value: "vllm"
        - name: ATTN_BUCKETIZED_NUM_REQS
          value: "true"
        - name: ATTN_CUSTOM_NUM_REQS_BUCKETS
          value: "8,16,32,64,128,256"
        - name: NEW_MODEL_DESIGN
          value: "1"
        - name: LIBTPU_INIT_ARGS
          value: "--xla_tpu_use_minor_sharding_for_major_trivial_input=true --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false --xla_tpu_ars_combiner_threshold_in_bytes=0 --xla_tpu_enable_async_collective_merger=false"
        - name: XLA_CACHE_DIR
          value: "/data/xla_cache"
        - name: HF_HOME
          value: /data
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: hf_api_token
        ports:
        - containerPort: 8000
        resources:
          limits:
            google.com/tpu: '4'
          requests:
            google.com/tpu: '4'
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - mountPath: "/data"
          name: data-volume
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - emptyDir:
          medium: Memory
        name: dshm
      - name: data-volume
        persistentVolumeClaim:
          claimName: hd-claim-qwen38
---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-service
  namespace: vllm-qwen38
spec:
  selector:
    app: vllm-qwen38
  type: ClusterIP
  ports:
  - name: http
    protocol: TCP
    port: 8000
    targetPort: 8000
