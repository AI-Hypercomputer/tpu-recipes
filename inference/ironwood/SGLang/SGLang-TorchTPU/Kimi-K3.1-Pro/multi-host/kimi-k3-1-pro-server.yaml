apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hyperdisk-balanced-tpu
provisioner: pd.csi.storage.gke.io
parameters:
  type: hyperdisk-balanced
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: sglang-kimi-k3-1-pro
  namespace: sglang-kimi-k3-1-pro
  annotations:
    leaderworkerset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  leaderWorkerTemplate:
    size: 4
    restartPolicy: RecreateGroupOnPodRestart
    workerTemplate:
      metadata:
        labels:
          app: sglang-kimi-k3-1-pro
      spec:
        terminationGracePeriodSeconds: 75
        nodeSelector:
          cloud.google.com/gke-tpu-accelerator: tpu7x
          cloud.google.com/gke-tpu-topology: 2x2x4
        tolerations:
          - key: "google.com/tpu"
            operator: "Exists"
            effect: "NoSchedule"
        containers:
          - name: sglang-torchtpu
            image: lmsysorg/sglang:dev-kimi-k31-pro-tpu
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-c"]
            args:
              - |
                set -euo pipefail
                mkdir -p "${HF_HOME}" "${TORCH_TPU_INTERNAL_TIER3_COMPILATION_CACHE_ROOT}"

                # Prewarm Hugging Face trust_remote_code modules in a single process
                # before spawning 8 local TP worker processes per host.
                python3 -c '
                import transformers as t
                for cls in (t.AutoConfig, t.AutoTokenizer, t.AutoProcessor):
                    try:
                        cls.from_pretrained("moonshotai/Kimi-K3.1-Pro", trust_remote_code=True)
                    except Exception:
                        pass
                ' || true

                # Prefer IPv4 when resolving LWS_LEADER_ADDRESS for PyTorch distributed init.
                echo 'precedence ::ffff:0:0/96  100' >> /etc/gai.conf || true

                # 4 hosts x 4 chips x 2 TensorCores = TP 32, EP 8 across one tpu7x 2x2x4 slice,
                # sparse MLA + KDA hybrid KV pools (fp8_e4m3, page_size 128, 480K context).
                exec python3 -m sglang.launch_server \
                  --model-path moonshotai/Kimi-K3.1-Pro \
                  --served-model-name moonshotai/Kimi-K3.1-Pro \
                  --trust-remote-code \
                  --host 0.0.0.0 \
                  --port 8000 \
                  --device tpu \
                  --dtype bfloat16 \
                  --tp-size 32 \
                  --ep-size 8 \
                  --nnodes "${LWS_GROUP_SIZE}" \
                  --node-rank "${LWS_WORKER_INDEX}" \
                  --dist-init-addr "${LWS_LEADER_ADDRESS}:29501" \
                  --attention-backend pallas_tpu_mla_sparse \
                  --grammar-backend none \
                  --reasoning-parser kimi_k3 \
                  --tool-call-parser kimi_k3 \
                  --kv-cache-dtype fp8_e4m3 \
                  --page-size 128 \
                  --mem-fraction-static 0.85 \
                  --context-length 491520 \
                  --max-total-tokens 4000000 \
                  --chunked-prefill-size 4096 \
                  --max-prefill-tokens 4096 \
                  --prefill-max-requests 8 \
                  --max-running-requests 64 \
                  --schedule-conservativeness 0.3 \
                  --scheduler-recv-interval 16 \
                  --enable-torch-compile \
                  --torch-compile-max-bs 64 \
                  --tpu-compile-bs 1 2 4 8 16 32 64 \
                  --tpu-compile-tokens 4096 \
                  --tpu-fp8-runtime channelwise \
                  --disable-radix-cache \
                  --enable-metrics \
                  --skip-server-warmup \
                  --weight-loader-disable-mmap \
                  --weight-loader-drop-cache-after-load \
                  --enforce-disable-flashinfer-allreduce-fusion \
                  --watchdog-timeout 3600
            env:
              - name: HF_HOME
                value: /data/huggingface
              - name: HUGGING_FACE_HUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: hf_api_token
                    optional: true
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hf-secret
                    key: hf_api_token
                    optional: true
              - name: SGLANG_PLATFORM
                value: "tpu"
              - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
                value: "0"
              - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
                value: "1"
              - name: SGLANG_TPU_PRELOAD_TELEMETRY_STUB
                value: "1"
              - name: SGLANG_TPU_OVERLAP_PROFILE
                value: "1"
              - name: TORCH_TPU_INTERNAL_MATERIALIZE_COLLECTIVE_TENSORS
                value: "false"
              - name: TORCH_TPU_INTERNAL_TIER2_COMPILATION_CACHE
                value: "torchtpu_kimi_k3_1"
              - name: TORCH_TPU_INTERNAL_TIER3_COMPILATION_CACHE_ROOT
                value: /data/torch_tpu_compile_cache
              - name: TORCH_TPU_INTERNAL_TIER3_COMPILATION_CACHE_LOCAL_BACKUP_TASK
                value: "1"
              - name: TPU_ENABLE_DIAGNOSTIC_COORDINATOR
                value: "0"
              - name: TPU_DISABLE_DIAGNOSTIC_COORDINATOR
                value: "1"
              - name: TPU_ENABLE_TELEMETRY
                value: "0"
              - name: TPU_ENABLE_TELEMETRY_HARVESTING
                value: "0"
              - name: ENABLE_TPU_TELEMETRY
                value: "0"
              - name: TPU_TELEMETRY_INTERVAL_SEC
                value: "86400"
              - name: TPU_TELEMETRY_INTERVAL_SECONDS
                value: "86400"
              - name: TPU_DIAGNOSTIC_HARVESTER_INTERVAL_SEC
                value: "86400"
              - name: SGLANG_TPU_EAGER_MODE
                value: "DEFER_AND_FUSE"
              - name: SGLANG_TPU_FUSED_MOE_PERMUTE_DENSE_THRESHOLD
                value: "512"
              - name: SGLANG_TPU_K3_STATIC_FP8
                value: "moe_front,latent_up,kda_qkvg"
              - name: SGLANG_TPU_ENABLE_K3_HOST_SPLIT_GEMV
                value: "1"
              - name: SGLANG_TPU_ENABLE_TWOLEVEL_ALLREDUCE
                value: "1"
              - name: SGLANG_K3_MERGE_MOE_ALLREDUCE
                value: "1"
              - name: SGLANG_TPU_ENABLE_K3_ATTN_RES_KERNEL
                value: "1"
              - name: SGLANG_TPU_ENABLE_NN_MODULE_GUARD_FILTER
                value: "1"
              - name: SGLANG_TPU_ENABLE_QBLOCK_SPARSE_MLA_PREFILL
                value: "1"
              - name: SGLANG_TPU_DSA_INDEXER_TOKEN_SPLIT
                value: "1"
              - name: SGLANG_TPU_VL_TEXT_ONLY_EXTEND
                value: "1"
              - name: SGLANG_SET_CPU_AFFINITY
                value: "1"
              - name: SGLANG_TPU_ASYNC_COPY_WORKER
                value: "0"
              - name: SGLANG_TPU_TWOLEVEL_ALLREDUCE_SPLIT_BARRIER
                value: "1"
              - name: SGLANG_TPU_K3_QKVG_PREFETCH
                value: "1"
              - name: SGLANG_TPU_K3_LATENT_UP_ATTN_RES
                value: "1"
              - name: SGLANG_TPU_K3_OPROJ_ROW
                value: "1"
              - name: SGLANG_TPU_DYNAMO_PARAMS_AS_GRAPH_ATTRS
                value: "2"
              - name: SGLANG_TPU_ALLOC_DECODE_FAST_PATH
                value: "1"
              - name: SGLANG_TPU_LOGITS_ONESHOT_GATHER
                value: "1"
              - name: SGLANG_TPU_DECODE_SKIP_GUARD_EVAL
                value: "1"
              - name: SGLANG_TPU_AOT_LEAN_RUNTIME_WRAPPER
                value: "1"
              - name: SGLANG_TPU_SPLIT_EXEC_DIRECT_CALL
                value: "1"
              - name: SGLANG_TPU_PALLAS_VMEM_RIGHTSIZE
                value: "1"
              - name: LIBTPU_INIT_ARGS
                value: "--xla_tpu_enable_async_collective_fusion=true --xla_tpu_overlap_compute_collective_tc=true --xla_tpu_enable_async_collective_fusion_multiple_steps=true --xla_tpu_enable_latency_hiding_scheduler=true --xla_latency_hiding_scheduler_rerun=10 --xla_tpu_all_gather_collective_matmul_mode=post_spmd_conservative --xla_tpu_reduce_scatter_collective_matmul_mode=post_spmd_conservative --xla_tpu_enable_sparse_core_collective_offload_all_reduce=false --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=false --xla_tpu_buffer_assignment_enable_fast_merge_fallback=false --xla_tpu_offload_gather_to_sparsecore=true"
            ports:
              - name: http
                containerPort: 8000
                protocol: TCP
            resources:
              limits:
                google.com/tpu: "4"
              requests:
                google.com/tpu: "4"
            # Downloading ~1 TB of weights and compiling the TPU programs takes a while
            # on first start; allow up to 4 hours before the pod is considered failed.
            startupProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    if [ "${LWS_WORKER_INDEX:-0}" = "0" ]; then
                      curl -sf http://127.0.0.1:8000/health >/dev/null
                    else
                      exit 0
                    fi
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 480
            readinessProbe:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    if [ "${LWS_WORKER_INDEX:-0}" = "0" ]; then
                      curl -sf http://127.0.0.1:8000/health >/dev/null
                    else
                      exit 0
                    fi
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
            volumeMounts:
              - name: data-volume
                mountPath: /data
              - name: dshm
                mountPath: /dev/shm
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
          - name: data-volume
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: hyperdisk-balanced-tpu
                  resources:
                    requests:
                      storage: 2500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-kimi-k3-1-pro-service
  namespace: sglang-kimi-k3-1-pro
spec:
  selector:
    app: sglang-kimi-k3-1-pro
    leaderworkerset.sigs.k8s.io/worker-index: "0"
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
