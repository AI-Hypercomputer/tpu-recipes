name: Run Benchmarks

on:
  push:
    branches:
      - add-gemma4-v7-benchmark
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/run_benchmarks.yml"
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'gemma4.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'tpu_v7.*')."
        required: false
        type: string
        default: ""
      custom_metadata:
        description: "JSON string of metadata to append to the benchmark result."
        required: false
        type: string
        default: "{}"

permissions:
  contents: read
  pull-requests: write

jobs:
  run_benchmarks:
    name: Run TPU Recipe Benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@e7d52af8bf9f9e420c162486bb1d0b36e8405992 # main
    with:
      registry_file: "benchmarks/benchmark_registry.pbtxt"
      bap_ref: "e7d52af8bf9f9e420c162486bb1d0b36e8405992"
      runner: "linux-x86-n4-16"
      publish_metrics: false
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      environment_filter: ${{ inputs.environment_filter || '' }}
      custom_metadata: ${{ inputs.custom_metadata || '{}' }}
    secrets:
      HF_TOKEN: ${{ secrets.BAP_HF_TOKEN }}
