apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${WORKLOAD_NAME}
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  ttlSecondsAfterFinished: 43200
  failurePolicy:
    rules:
      - action: FailJobSet
        onJobFailureReasons:
        - PodFailurePolicy
    maxRestarts: 0
  replicatedJobs:
    - name: slice-job
      replicas: 1
      template:
        spec:
          parallelism: 16    # Equal to the number of VMs per slice (or sub-slice).
          completions: 16    # Same as the above.
          backoffLimit: 0   # When any pod fails, the job is failed
          
          podFailurePolicy:
            rules:
          
            - action: FailJob
              onPodConditions: []
              onExitCodes:
                containerName: jax-tpu
                operator: NotIn
                values: [42,127,128,129,130,131,132,133,134,135,136,137,138,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154,155,156,157,158,159,160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,219,220,221,222,223,224,225,226,227,228,229,230,231,232,233,234,235,236,237,238,239,240,241,242,243,244,245,246,247,248,249,250,251,252,253,254,255]
          template:
            spec:
              schedulerName: default-scheduler
              imagePullSecrets:
              - name: None
              restartPolicy: Never
              
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x4x4
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              terminationGracePeriodSeconds: 30
              containers:
              
              - name: jax-tpu
                image: ${WORKLOAD_IMAGE}
                
                env: 
                securityContext:
                  privileged: true
                command:
                - bash
                - -c
                - |
                  echo XPK Start: $(date);
                  _sigterm() (kill -SIGTERM $! 2>/dev/null;);
                  trap _sigterm SIGTERM;
                  
                  (export TPU_STDERR_LOG_LEVEL=0 && export TPU_MIN_LOG_LEVEL=0 && export TF_CPP_MIN_LOG_LEVEL=0 && export TPU_VMODULE=real_program_continuator=1 && set -e && set -o pipefail && export ENABLE_PATHWAYS_PERSISTENCE='1' && export LIBTPU_INIT_ARGS='   --xla_tpu_scoped_vmem_limit_kib=65536   --xla_tpu_bf16_emission_mode=NATIVE_EMISSION   --xla_tpu_enable_sparse_core_reduce_scatter_v2=true   --xla_tpu_enable_sparse_core_collective_offload_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true   --xla_tpu_enable_all_gather_offload_tracing=true   --xla_tpu_use_tc_device_shape_on_sc=True   --xla_sc_disable_megacore_partitioning=True   --xla_tpu_enable_async_collective_fusion_fuse_all_gather=false   --xla_enable_async_all_gather=true   --xla_tpu_prefer_async_allgather_to_allreduce=true   --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true   --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true   --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true   --xla_tpu_use_single_sparse_core_for_all_gather_offload=true   --xla_tpu_enable_concurrent_sparse_core_offloading=true   --xla_max_concurrent_async_all_gathers=2   --xla_max_concurrent_async_reduce_scatters=2   --xla_tpu_aggressive_opt_barrier_removal=true   --xla_tpu_enable_offloading_gather_to_sparsecore=true   --xla_tpu_sparse_core_all_gather_latency_multiplier=1   --xla_tpu_sparse_core_reduce_scatter_latency_multiplier=3   --xla_tpu_enable_sparse_core_collective_aggregator=true   --xla_tpu_enable_latency_hiding_layer_scheduler=false   --xla_tpu_rerun_latency_hiding_scheduler_post_sc_assignment=true   --xla_tpu_enable_offloading_copy_to_sparsecore=false   --xla_tpu_scheduler_percent_shared_memory_limit=150   --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true   --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true   --xla_tpu_pcie_bandwidth_multiplier=0.03   --xla_tpu_enable_multi_compute_overlap_in_layer_scheduler=true ' && export ARTIFACT_DIR='${BASE_OUTPUT_DIR}/${WORKLOAD_NAME}' && export JAX_PLATFORMS='tpu,cpu' && export ENABLE_PJRT_COMPATIBILITY='true' &&   python3 -m maxtext.trainers.pre_train.train maxtext/configs/base.yml model_name=gpt-oss-120b per_device_batch_size=10.0 max_target_length=8192 skip_jax_distributed_system=True dtype=bfloat16 weight_dtype=float32 skip_first_n_steps_for_profiler=5 profile_periodically_period=10000 async_checkpointing=False enable_checkpointing=False use_custom_sort_vjp=True shard_exp_on_fsdp=True use_tokamax_gmm=True use_random_routing=True remat_policy=custom decoder_layer_input=offload mlpwo=offload opt_type=adamw megablox=True sparse_matmul=True profiler=xplane use_tokamax_splash=True sa_block_q=1024 sa_block_kv=1024 sa_block_kv_compute=1024 sa_block_q_dkv=2048 sa_block_kv_dkv=2048 sa_block_kv_dkv_compute=2048 sa_block_q_dq=2048 sa_block_kv_dq=2048 sa_use_fused_bwd_kernel=True sa_q_layout=SEQ_MINOR sa_k_layout=SEQ_MINOR sa_v_layout=SEQ_MINOR attention=flash dcn_pipeline_parallelism=1 dcn_data_parallelism=-1 ici_pipeline_parallelism=1 ici_fsdp_transpose_parallelism=1 ici_fsdp_parallelism=64 ici_data_parallelism=2 dataset_type=synthetic dataset_path=gs://<your_gcs_bucket> use_gmm_v2=True wi_tile_fwd_batch_seq=256 wi_tile_fwd_embed_dim=2880 wi_tile_fwd_mlp_dim=2944 wi_tile_dlhs_batch_seq=256 wi_tile_dlhs_mlp_dim=2880 wi_tile_dlhs_embed_dim=2944 wi_tile_drhs_batch_seq=512 wi_tile_drhs_embed_dim=2880 wi_tile_drhs_mlp_dim=1536 wo_tile_fwd_batch_seq=256 wo_tile_fwd_mlp_dim=2880 wo_tile_fwd_embed_dim=2944 wo_tile_dlhs_batch_seq=256 wo_tile_dlhs_embed_dim=2880 wo_tile_dlhs_mlp_dim=2944 wo_tile_drhs_batch_seq=512 wo_tile_drhs_mlp_dim=2880 wo_tile_drhs_embed_dim=1536 steps=20 base_output_directory=${BASE_OUTPUT_DIR} run_name=${WORKLOAD_NAME} | tee train.log && gcloud storage cp --no-user-output-enabled train.log ${BASE_OUTPUT_DIR}/${WORKLOAD_NAME}/logs/train-${TPU_WORKER_ID}.log) & PID=$!;
                  while kill -0 $PID 2>/dev/null;
                      do sleep 5;
                  done;
                  wait $PID;
                  EXIT_CODE=$?;
                  
                  echo XPK End: $(date);
                  echo EXIT_CODE=$EXIT_CODE;
                  
                  
                  exit $EXIT_CODE
                resources:
                  limits:
                    google.com/tpu: 4

                volumeMounts:
                - mountPath: /dev/shm
                  name: dshm-2
                

              tolerations:
              
              - operator: "Exists"
                key: google.com/tpu
        
              volumes:
              - emptyDir:
                  medium: Memory
                name: dshm-2
              