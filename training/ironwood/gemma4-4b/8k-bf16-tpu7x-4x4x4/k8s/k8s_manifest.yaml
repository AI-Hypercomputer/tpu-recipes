apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${WORKLOAD_NAME}
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  ttlSecondsAfterFinished: 3600
  failurePolicy:
    maxRestarts: 0
    rules:
      - action: FailJobSet
        onJobFailureReasons:
          - PodFailurePolicy
  replicatedJobs:
    - name: main-job
      replicas: 1
      template:
        spec:
          parallelism: 16
          completions: 16
          backoffLimit: 0
          template:
            metadata:
              annotations:
                cloud.google.com/gke-tpu-slice-topology: 4x4x4
            spec:
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              terminationGracePeriodSeconds: 30
              restartPolicy: Never
              containers:
              - name: workload-container-1
                image: ${WORKLOAD_IMAGE}
                command:
                - "/bin/bash"
                - "-c"
                - "set -e && set -o pipefail && export ENABLE_PATHWAYS_PERSISTENCE='1' && export LIBTPU_INIT_ARGS='     --xla_tpu_scoped_vmem_limit_kib=65536   --xla_tpu_bf16_emission_mode=NATIVE_EMISSION   --xla_tpu_enable_sparse_core_reduce_scatter_v2=true   --xla_tpu_enable_sparse_core_collective_offload_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true   --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true   --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true   --xla_tpu_use_single_sparse_core_for_all_gather_offload=true   --xla_tpu_use_tc_device_shape_on_sc=true   --xla_sc_disable_megacore_partitioning=true   --xla_enable_async_all_gather=true   --xla_tpu_prefer_async_allgather_to_allreduce=true   --xla_tpu_enable_latency_hiding_layer_scheduler=true   --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true   --xla_tpu_scheduler_percent_shared_memory_limit=150   --xla_tpu_enable_sparse_core_collective_aggregator=true   --xla_tpu_enable_all_gather_offload_tracing=true ' && export ARTIFACT_DIR='${BASE_OUTPUT_DIR}/${WORKLOAD_NAME}' && export JAX_PLATFORMS='tpu,cpu' && export ENABLE_PJRT_COMPATIBILITY='true' &&   set +e; python3 -u -m maxtext.trainers.pre_train.train maxtext/configs/base.yml model_name=gemma4-e4b skip_jax_distributed_system=True scan_layers=False dtype=bfloat16 per_device_batch_size=2 max_target_length=8192 async_checkpointing=False enable_checkpointing=False use_iota_embed=True num_vocab_tiling=8 remat_policy=full allow_split_physical_axes=True ici_data_parallelism=4 ici_fsdp_parallelism=-1 attention=flash use_tokamax_splash=True sa_use_fused_bwd_kernel=True sa_block_q=1024 sa_block_kv=1024 sa_block_kv_compute=512 sa_block_q_dkv=1024 sa_block_kv_dkv=1024 sa_block_kv_dkv_compute=256 dataset_type=synthetic opt_type=adamw steps=30 base_output_directory=${BASE_OUTPUT_DIR} run_name=${WORKLOAD_NAME} profiler=xplane skip_first_n_steps_for_profiler=5 profiler_steps=3 | tee train.log; TRAIN_EXIT_CODE=${PIPESTATUS[0]}; if [ -s train.log ]; then   timeout 30s gcloud storage cp --no-user-output-enabled train.log ${ARTIFACT_DIR}/logs/train-${TPU_WORKER_ID:-${JOBSET_WORKER_INDEX:-${HOSTNAME:-0}}}-1.log || true; fi; exit ${TRAIN_EXIT_CODE}"
                resources:
                  limits:
                    google.com/tpu: "2"
                env:
                - name: TPU_STDERR_LOG_LEVEL
                  value: "0"
                - name: TPU_MIN_LOG_LEVEL
                  value: "0"
                - name: TF_CPP_MIN_LOG_LEVEL
                  value: "0"
                - name: TPU_VMODULE
                  value: "real_program_continuator=1"
              - name: workload-container-2
                image: ${WORKLOAD_IMAGE}
                command:
                - "/bin/bash"
                - "-c"
                - "set -e && set -o pipefail && export ENABLE_PATHWAYS_PERSISTENCE='1' && export LIBTPU_INIT_ARGS='     --xla_tpu_scoped_vmem_limit_kib=65536   --xla_tpu_bf16_emission_mode=NATIVE_EMISSION   --xla_tpu_enable_sparse_core_reduce_scatter_v2=true   --xla_tpu_enable_sparse_core_collective_offload_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_2d_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_3d_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_nd_reduce_scatter=true   --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true   --xla_tpu_enable_sparse_core_collective_offload_reduce_scatter=true   --xla_tpu_use_single_sparse_core_for_all_gather_offload=true   --xla_tpu_use_tc_device_shape_on_sc=true   --xla_sc_disable_megacore_partitioning=true   --xla_enable_async_all_gather=true   --xla_tpu_prefer_async_allgather_to_allreduce=true   --xla_tpu_enable_latency_hiding_layer_scheduler=true   --xla_tpu_enable_layer_scheduler_for_dependent_collectives=true   --xla_tpu_scheduler_percent_shared_memory_limit=150   --xla_tpu_enable_sparse_core_collective_aggregator=true   --xla_tpu_enable_all_gather_offload_tracing=true ' && export ARTIFACT_DIR='${BASE_OUTPUT_DIR}/${WORKLOAD_NAME}' && export JAX_PLATFORMS='tpu,cpu' && export ENABLE_PJRT_COMPATIBILITY='true' &&   set +e; python3 -u -m maxtext.trainers.pre_train.train maxtext/configs/base.yml model_name=gemma4-e4b skip_jax_distributed_system=True scan_layers=False dtype=bfloat16 per_device_batch_size=2 max_target_length=8192 async_checkpointing=False enable_checkpointing=False use_iota_embed=True num_vocab_tiling=8 remat_policy=full allow_split_physical_axes=True ici_data_parallelism=4 ici_fsdp_parallelism=-1 attention=flash use_tokamax_splash=True sa_use_fused_bwd_kernel=True sa_block_q=1024 sa_block_kv=1024 sa_block_kv_compute=512 sa_block_q_dkv=1024 sa_block_kv_dkv=1024 sa_block_kv_dkv_compute=256 dataset_type=synthetic opt_type=adamw steps=30 base_output_directory=${BASE_OUTPUT_DIR} run_name=${WORKLOAD_NAME} profiler=xplane skip_first_n_steps_for_profiler=5 profiler_steps=3 | tee train.log; TRAIN_EXIT_CODE=${PIPESTATUS[0]}; if [ -s train.log ]; then   timeout 30s gcloud storage cp --no-user-output-enabled train.log ${ARTIFACT_DIR}/logs/train-${TPU_WORKER_ID:-${JOBSET_WORKER_INDEX:-${HOSTNAME:-0}}}-2.log || true; fi; exit ${TRAIN_EXIT_CODE}"
                resources:
                  limits:
                    google.com/tpu: "2"
                env:
                - name: TPU_STDERR_LOG_LEVEL
                  value: "0"
                - name: TPU_MIN_LOG_LEVEL
                  value: "0"
                - name: TF_CPP_MIN_LOG_LEVEL
                  value: "0"
                - name: TPU_VMODULE
                  value: "real_program_continuator=1"
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x4x4
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: cloud.google.com/gke-nodepool
                        operator: NotIn
                        values:
                        - default-pool
              tolerations:
                - effect: NoSchedule
                  key: google.com/tpu
                  operator: Exists
