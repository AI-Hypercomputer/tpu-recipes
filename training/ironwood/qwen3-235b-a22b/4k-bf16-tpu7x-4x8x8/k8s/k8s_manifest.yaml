apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: ${WORKLOAD_NAME}
  annotations:
    alpha.jobset.sigs.k8s.io/exclusive-topology: cloud.google.com/gke-nodepool
spec:
  ttlSecondsAfterFinished: 43200
  failurePolicy:
    rules:
      - action: FailJobSet
        onJobFailureReasons:
        - PodFailurePolicy
    maxRestarts: 0
  replicatedJobs:
    - name: slice-job
      replicas: 1
      template:
        spec:
          parallelism: 64    # Equal to the number of VMs per slice (or sub-slice).
          completions: 64    # Same as the above.
          backoffLimit: 0   # When any pod fails, the job is failed
          podFailurePolicy:
            rules:
            - action: FailJob
              onPodConditions: []
              onExitCodes:
                containerName: jax-tpu
                operator: NotIn
                values: [42,127,128,129,130,131,132,133,134,135,136,137,138,139,140,141,142,143,144,145,146,147,148,149,150,151,152,153,154,155,156,157,158,159,160,161,162,163,164,165,166,167,168,169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,207,208,209,210,211,212,213,214,215,216,217,218,219,220,221,222,223,224,225,226,227,228,229,230,231,232,233,234,235,236,237,238,239,240,241,242,243,244,245,246,247,248,249,250,251,252,253,254,255]
          template:
            spec:
              restartPolicy: Never
              hostNetwork: true
              dnsPolicy: ClusterFirstWithHostNet
              containers:
              - name: jax-tpu
                image: ${WORKLOAD_IMAGE}
                ports:
                - containerPort: 8471
                - containerPort: 8080
                securityContext:
                  privileged: true
                command:
                - "/bin/bash"
                - "-c"
                - "set -e && set -o pipefail && export ENABLE_PATHWAYS_PERSISTENCE='1' && export LIBTPU_INIT_ARGS='  --xla_tpu_dvfs_p_state=3   --xla_tpu_scoped_vmem_limit_kib=61440   --xla_tpu_enable_sparse_core_collective_offload_all_gather=true   --xla_tpu_enable_sparse_core_collective_offload_all_reduce=true   --xla_tpu_use_single_sparse_core_for_all_gather_offload=true   --xla_tpu_enable_all_experimental_scheduler_features=true   --xla_tpu_enable_scheduler_memory_pressure_tracking=true   --xla_tpu_host_transfer_overlap_limit=24   --xla_tpu_aggressive_opt_barrier_removal=ENABLED   --xla_lhs_prioritize_async_depth_over_stall=ENABLED   --xla_tpu_enable_ag_backward_pipelining=true   --xla_should_allow_loop_variant_parameter_in_chain=ENABLED   --xla_should_add_loop_invariant_op_in_chain=ENABLED   --xla_max_concurrent_host_send_recv=100   --xla_tpu_scheduler_percent_shared_memory_limit=100   --xla_latency_hiding_scheduler_rerun=2 ' && export ARTIFACT_DIR='${BASE_OUTPUT_DIR}/${WORKLOAD_NAME}' && export JAX_PLATFORMS='tpu,cpu' && export ENABLE_PJRT_COMPATIBILITY='true' && set +e; python3 -u -m maxtext.trainers.pre_train.train maxtext/configs/base.yml model_name=qwen3-235b-a22b per_device_batch_size=16.0 max_target_length=4096 skip_jax_distributed_system=True dtype=bfloat16 weight_dtype=float32 opt_type=adamw profiler=xplane skip_first_n_steps_for_profiler=5 profiler_steps=3 profile_periodically_period=10000 async_checkpointing=False enable_checkpointing=False remat_policy=custom decoder_layer_input=offload use_custom_sort_vjp=True use_random_routing=True shard_exp_on_fsdp=False megablox=False sparse_matmul=True use_tokamax_gmm=True use_tokamax_splash=True sa_use_fused_bwd_kernel=True attention=flash sa_block_q=1024 sa_block_kv=1024 sa_block_kv_compute=512 sa_block_q_dkv=2048 sa_block_kv_dkv=2048 sa_block_kv_dkv_compute=1024 sa_block_q_dq=1024 sa_block_kv_dq=1024 sa_q_layout=HEAD_DIM_MINOR sa_k_layout=SEQ_MINOR sa_v_layout=HEAD_DIM_MINOR dcn_pipeline_parallelism=1 dcn_data_parallelism=-1 ici_pipeline_parallelism=1 ici_fsdp_transpose_parallelism=1 ici_fsdp_parallelism=-1 dataset_type=synthetic dataset_path=gs://max-datasets-rogue steps=20 base_output_directory=${BASE_OUTPUT_DIR} run_name=${WORKLOAD_NAME} | tee train.log; TRAIN_EXIT_CODE=${PIPESTATUS[0]}; if [ -s train.log ]; then timeout 30s gcloud storage cp --no-user-output-enabled train.log ${ARTIFACT_DIR}/logs/train-${TPU_WORKER_ID:-${JOBSET_WORKER_INDEX:-${HOSTNAME:-0}}}.log || true; fi; exit ${TRAIN_EXIT_CODE}"
                resources:
                  limits:
                    google.com/tpu: "4"
                env:
                - name: TPU_STDERR_LOG_LEVEL
                  value: "0"
                - name: TPU_MIN_LOG_LEVEL
                  value: "0"
                - name: TF_CPP_MIN_LOG_LEVEL
                  value: "0"
                - name: TPU_VMODULE
                  value: "real_program_continuator=1"
              nodeSelector:
                cloud.google.com/gke-tpu-accelerator: tpu7x
                cloud.google.com/gke-tpu-topology: 4x8x8
                cloud.google.com/placement-policy-name: ${PLACEMENT_POLICY_NAME}
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                    - matchExpressions:
                      - key: cloud.google.com/gke-nodepool
                        operator: NotIn
                        values:
                        - default-pool
              tolerations:
                - effect: NoSchedule
                  key: google.com/tpu
                  operator: Exists
